name: Deploy Snowflake artifacts

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target Snowflake environment
        required: true
        type: choice
        options: [DEV, SIT, UAT, PROD]
      dry_run:
        description: Preview the deployment plan without changing Snowflake
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  TARGET_REF: origin/main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'DEV' }}
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch target branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Reject a branch behind target
        run: git merge-base --is-ancestor "$TARGET_REF" HEAD

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deployment dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Deploy branch-scoped artifacts
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
          SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
          SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
          SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}
          SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
        run: >-
          python deployment/deploy.py
          --environment "${{ inputs.environment || 'DEV' }}"
          --target-ref "$TARGET_REF"
          ${{ inputs.dry_run && '--dry-run' || '' }}
